  <style>

    a { display: inline-flex; align-items: center; gap: 8px; font-family: "Montserrat", sans-serif; font-weight: 700;
        color: #fff; padding: 15px 30px; border-radius: 999px; text-decoration: none; transition: transform .2s; }
    a:hover { transform: translateY(-2px); }
    .a-home { background: #fff; color: #0a1f44; }
    .a-call { background: linear-gradient(135deg, #ff7a1a, #e85f00); box-shadow: 0 12px 30px rgba(255,122,26,.4); }
