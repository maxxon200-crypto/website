<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1F1A14" />
  <title>Pagina non trovata. Idraulico H24 Milano</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Mona+Sans:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F2EDE4; --surface: #FBF8F2; --ink: #1F1A14; --ink-soft: #5C5247;
      --accent: #9A5B2E; --accent-deep: #6E3E1F; --accent-tint: #E9D9C6; --line: #D8CDBC;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: "Mona Sans", system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center;
      text-align: center; padding: 24px; color: var(--ink); background: var(--bg);
    }
    .code {
      font-family: "Space Grotesk", monospace; font-weight: 600; font-size: clamp(5rem, 22vw, 10rem);
      line-height: 1; letter-spacing: -2px; color: var(--accent);
    }
    h1 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: clamp(1.4rem, 4vw, 2rem); margin: 8px 0 12px; color: var(--ink); }
    p { color: var(--ink-soft); max-width: 460px; margin: 0 auto 28px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-flex; align-items: center; gap: 8px; font-family: "Mona Sans", sans-serif; font-weight: 600;
      padding: 15px 28px; border-radius: 10px; text-decoration: none; border: 1px solid transparent;
      transition: transform .16s, background .16s, border-color .16s, color .16s;
    }
    a:hover { transform: translateY(-1px); }
    .a-home { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .a-home:hover { border-color: var(--accent); color: var(--accent-deep); }
    .a-call { background: var(--accent); color: var(--surface); }
    .a-call:hover { background: var(--accent-deep); }
    .a-call .num { font-family: "Space Grotesk", monospace; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Pagina non trovata</h1>
    <p>Questa pagina non c'è, o l'abbiamo spostata. Ma noi ci siamo: per un'emergenza idraulica a Milano chiama pure, rispondiamo noi 24 ore su 24.</p>
    <div class="actions">
      <a class="a-home" href="/idraulico-h24/">← Torna alla home</a>
      <a class="a-call" href="tel:+393450834365">Chiama <span class="num">345 083 4365</span></a>
    </div>
  </main>
</body>
</html>
