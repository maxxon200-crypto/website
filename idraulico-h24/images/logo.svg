<svg viewBox="0 0 520 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Idraulico H24 Milano">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c3e6"/>
      <stop offset="1" stop-color="#0a63c9"/>
    </linearGradient>
  </defs>

  <!-- Icona: goccia + chiave inglese -->
  <g transform="translate(8,12)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="#0a1f44"/>
    <!-- goccia d'acqua -->
    <path d="M52 18c14 17 24 27 24 41a24 24 0 0 1-48 0c0-14 10-24 24-41Z" fill="url(#drop)"/>
    <path d="M40 60a12 12 0 0 0 12 12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- chiave inglese stilizzata -->
    <g transform="rotate(45 52 86)">
      <rect x="46" y="70" width="12" height="30" rx="4" fill="#ff7a1a"/>
      <path d="M52 60a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 6a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="#ff7a1a"/>
    </g>
  </g>

  <!-- Testo -->
  <text x="128" y="58" font-family="Montserrat, 'Arial Black', sans-serif" font-weight="900" font-size="42" letter-spacing="1" fill="#0a1f44">IDRAULICO</text>
  <g>
    <rect x="129" y="74" width="74" height="34" rx="8" fill="#ff7a1a"/>
    <text x="166" y="99" text-anchor="middle" font-family="Montserrat, 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#ffffff">H24</text>
  </g>
  <text x="214" y="98" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#0a63c9">MILANO · 24H</text>
