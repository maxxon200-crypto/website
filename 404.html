<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata — Palestra Disnel ASD</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center;
      text-align: center; padding: 24px; color: #fff;
      background: radial-gradient(900px 500px at 80% -10%, rgba(31,63,196,.6), transparent 60%),
                  radial-gradient(700px 400px at -10% 110%, rgba(228,0,43,.5), transparent 55%),
                  linear-gradient(135deg, #0a1540, #111c5a);
    }
    .code { font-family: "Montserrat", sans-serif; font-weight: 900; font-size: clamp(5rem, 22vw, 11rem); line-height: 1; letter-spacing: -4px;
            background: linear-gradient(120deg, #fff, #7d93ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    h1 { font-family: "Montserrat", sans-serif; font-size: clamp(1.4rem, 4vw, 2rem); margin: 8px 0 12px; }
    p { color: #d6ddf2; max-width: 440px; margin: 0 auto 28px; }
    a { display: inline-flex; align-items: center; gap: 8px; font-family: "Montserrat", sans-serif; font-weight: 700;
        background: linear-gradient(135deg, #e4002b, #b80023); color: #fff; padding: 15px 30px; border-radius: 999px;
        text-decoration: none; box-shadow: 0 12px 30px rgba(228,0,43,.4); transition: transform .2s; }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Pagina non trovata</h1>
    <p>Ops! La pagina che cerchi non esiste o è stata spostata. Torna alla home della Palestra Disnel.</p>
    <a href="/">← Torna alla home</a>
  </main>
</body>
</html>
